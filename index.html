<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Advanced Calculator — Fast, Smooth & Accessible</title>
  <meta name="description" content="A fast, smooth, SEO-friendly calculator web app with keyboard support, history, and accessible UI. Lightweight and optimized for performance." />
  <meta name="author" content="wahididev">
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Advanced Calculator — Fast, Smooth & Accessible">
  <meta property="og:description" content="A fast, smooth, SEO-friendly calculator web app with keyboard support, history, and accessible UI.">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Advanced Calculator — Fast, Smooth & Accessible">

  <!-- Structured data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Advanced Calculator",
    "url": "https://wahididev.github.io/advanced-calculator/",
    "description": "A fast, smooth, SEO-friendly calculator web app with keyboard support, history, and accessible UI.",
    "applicationCategory": "Utilities",
    "operatingSystem": "All",
    "offers": {"@type": "Offer", "price": "0"}
  }
  </script>

  <!-- Preload critical CSS for fast first render -->
  <link rel="preload" href="assets/styles.css" as="style">
  <link rel="stylesheet" href="assets/styles.css">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="app" id="app">
    <header>
      <h1>Advanced Calculator</h1>
      <p class="tagline">Fast, smooth, and accessible — keyboard friendly with history and copy support.</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display" role="region" aria-live="polite">
        <div id="expression" class="expression" aria-hidden="true">0</div>
        <input id="input" class="screen" inputmode="numeric" aria-label="Calculator input" autocomplete="off" spellcheck="false" />
      </div>

      <div class="buttons" role="group" aria-label="Calculator buttons">
        <button data-action="clear" class="btn wide">C</button>
        <button data-action="back" class="btn">⌫</button>
        <button data-value="/" class="btn">÷</button>

        <button data-value="7" class="btn">7</button>
        <button data-value="8" class="btn">8</button>
        <button data-value="9" class="btn">9</button>
        <button data-value="*" class="btn">×</button>

        <button data-value="4" class="btn">4</button>
        <button data-value="5" class="btn">5</button>
        <button data-value="6" class="btn">6</button>
        <button data-value="-" class="btn">−</button>

        <button data-value="1" class="btn">1</button>
        <button data-value="2" class="btn">2</button>
        <button data-value="3" class="btn">3</button>
        <button data-value="+" class="btn">+</button>

        <button data-value="0" class="btn wide">0</button>
        <button data-value="." class="btn">.</button>
        <button data-action="equals" class="btn">=</button>
      </div>

      <div class="controls">
        <button id="copyBtn" class="link">Copy result</button>
        <button id="clearHistory" class="link">Clear history</button>
      </div>

      <aside class="history" aria-label="Calculation history">
        <h2>History</h2>
        <ul id="historyList"></ul>
      </aside>
    </section>

    <footer>
      <p>Built by <strong>wahididev</strong>. Lightweight, no frameworks, optimized for speed and accessibility.</p>
    </footer>
  </main>

  <script src="assets/script.js" defer></script>
</body>
</html>
