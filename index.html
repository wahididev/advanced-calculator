<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Advanced Calculator — Fast, Smooth & Accessible</title>
  <meta name="description" content="A fast, smooth, SEO-friendly calculator web app with keyboard support, scientific functions, memory, history, and offline support." />
  <meta name="author" content="wahididev">
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Advanced Calculator — Fast, Smooth & Accessible">
  <meta property="og:description" content="A fast, smooth, SEO-friendly calculator web app with keyboard support, scientific functions, memory, history, and offline support.">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Advanced Calculator — Fast, Smooth & Accessible">

  <!-- Structured data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Advanced Calculator",
    "url": "https://wahididev.github.io/advanced-calculator/",
    "description": "A fast, smooth, SEO-friendly calculator web app with keyboard support, scientific functions, memory, history, and offline support.",
    "applicationCategory": "Utilities",
    "operatingSystem": "All",
    "offers": {"@type": "Offer", "price": "0"}
  }
  </script>

  <!-- Preload critical CSS for fast first render -->
  <link rel="preload" href="assets/styles.css" as="style">
  <link rel="stylesheet" href="assets/styles.css">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="app" id="app">
    <header>
      <h1>Advanced Calculator</h1>
      <p class="tagline">Fast, smooth, accessible & powerful — scientific functions, memory, history, and offline-ready.</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="left">
        <div class="display" role="region" aria-live="polite">
          <div id="expression" class="expression" aria-hidden="true">0</div>
          <input id="input" class="screen" inputmode="text" aria-label="Calculator input" autocomplete="off" spellcheck="false" />
        </div>

        <div class="toolbar">
          <button id="toggleSci" class="link">Show scientific</button>
          <div class="memory">
            <button id="mc" class="btn small">MC</button>
            <button id="mr" class="btn small">MR</button>
            <button id="mPlus" class="btn small">M+</button>
            <button id="mMinus" class="btn small">M-</button>
            <div id="memDisplay" aria-live="polite" class="mem">M: <span id="memVal">0</span></div>
          </div>
        </div>

        <div class="buttons" role="group" aria-label="Calculator buttons">
          <button data-action="clear" class="btn wide">C</button>
          <button data-action="back" class="btn">⌫</button>
          <button data-value="/" class="btn">÷</button>

          <button data-value="7" class="btn">7</button>
          <button data-value="8" class="btn">8</button>
          <button data-value="9" class="btn">9</button>
          <button data-value="*" class="btn">×</button>

          <button data-value="4" class="btn">4</button>
          <button data-value="5" class="btn">5</button>
          <button data-value="6" class="btn">6</button>
          <button data-value="-" class="btn">−</button>

          <button data-value="1" class="btn">1</button>
          <button data-value="2" class="btn">2</button>
          <button data-value="3" class="btn">3</button>
          <button data-value="+" class="btn">+</button>

          <button data-value="0" class="btn wide">0</button>
          <button data-value="." class="btn">.</button>
          <button data-action="equals" class="btn">=</button>
        </div>

        <div class="controls">
          <button id="copyBtn" class="link">Copy result</button>
          <button id="exportHistory" class="link">Export history</button>
          <button id="clearHistory" class="link">Clear history</button>
        </div>
      </div>

      <aside class="right">
        <div class="science" id="sciencePanel" hidden>
          <h2>Scientific</h2>
          <div class="sci-grid">
            <button data-value="sin(" class="btn">sin</button>
            <button data-value="cos(" class="btn">cos</button>
            <button data-value="tan(" class="btn">tan</button>
            <button data-value="sqrt(" class="btn">√</button>

            <button data-value="log(" class="btn">log</button>
            <button data-value="ln(" class="btn">ln</button>
            <button data-value="^" class="btn">^</button>
            <button data-value="%" class="btn">%</button>

            <button data-value="(" class="btn">(</button>
            <button data-value=")" class="btn">)</button>
            <button data-value="pi" class="btn">π</button>
            <button data-value="e" class="btn">e</button>
          </div>
        </div>

        <div class="history" aria-label="Calculation history">
          <h2>History</h2>
          <ul id="historyList"></ul>
        </div>
      </aside>
    </section>

    <footer>
      <p>Built by <strong>wahididev</strong>. Lightweight and optimized for speed. Powered by math.js for advanced math.</p>
    </footer>
  </main>

  <!-- math.js for advanced/evaluated math expressions -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/dist/math.min.js" integrity="" crossorigin="anonymous" defer></script>
  <script src="assets/script.js" defer></script>
  <script>
    // register service worker if supported
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js').catch(()=>{/* ignore */});
    }
  </script>
</body>
</html>
